name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared Node.js floor (exact) and the current Node line.
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Browser syntax check
        run: npm run check
      - name: Extension type check
        run: npm run typecheck
      - name: Package and load smoke test
        run: npm run test:package

  e2e:
    # Playwright runs once (Chromium is expensive); Node 24 covers it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run editor end-to-end tests
        run: npm run test:e2e
