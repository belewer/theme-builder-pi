<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi Theme Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true">✦</span><div><h1>Pi Theme Builder</h1><p>Shape the colors of your terminal companion.</p></div></div>
    <div class="actions">
      <div class="action-group">
        <button id="importBtn" type="button" class="ghost" title="Import a theme JSON file">Import theme</button>
        <button id="importSessionBtn" type="button" class="ghost" title="Import a Pi session JSONL file">Import session</button>
      </div>
      <div class="action-group">
        <button id="undoBtn" type="button" class="ghost" title="Undo the last change">Undo</button>
        <button id="resetBtn" type="button" class="ghost" title="Reset this draft to the Dark preset">Reset theme</button>
      </div>
      <div class="action-group">
        <button class="primary" id="exportBtn" type="button">Export theme</button>
      </div>
      <div class="action-group">
        <div class="dropdown" id="piThemesDropdown" hidden>
          <button id="piThemesToggle" type="button" class="dropdown-toggle ghost" aria-haspopup="true" aria-expanded="false">Pi themes <span class="caret" aria-hidden="true">▾</span></button>
          <div class="dropdown-menu" role="menu" aria-label="Pi theme actions">
            <label for="piThemeSelect" class="menu-label">Saved themes</label>
            <select id="piThemeSelect" aria-label="Themes saved in Pi"><option value="">Pi themes…</option></select>
            <button id="refreshPiThemesBtn" type="button">Refresh themes</button>
            <button id="saveToPiBtn" type="button">Save to Pi</button>
            <button id="activatePiThemeBtn" type="button">Activate in Pi</button>
            <button id="setDefaultPiThemeBtn" type="button">Set Pi default</button>
          </div>
        </div>
        <div class="dropdown" id="piSessionsDropdown" hidden>
          <button id="piSessionsToggle" type="button" class="dropdown-toggle ghost" aria-haspopup="true" aria-expanded="false">Pi sessions <span class="caret" aria-hidden="true">▾</span></button>
          <div class="dropdown-menu" role="menu" aria-label="Pi session actions">
            <label for="piSessionSelect" class="menu-label">Sessions</label>
            <select id="piSessionSelect" aria-label="Pi sessions"><option value="">Pi sessions…</option></select>
            <button id="refreshPiSessionsBtn" type="button">Refresh sessions</button>
            <button id="viewPiSessionBtn" type="button">View session</button>
            <button id="saveSessionToPiBtn" type="button">Import session to Pi</button>
          </div>
        </div>
      </div>
      <input id="fileInput" type="file" accept=".json,application/json" hidden>
      <input id="sessionInput" type="file" accept=".jsonl,.jsonl.txt,application/json" hidden>
    </div>
  </header>
  <main>
    <aside class="panel editor">
      <div class="editor-head"><div><label for="themeName">Theme name</label><input id="themeName" placeholder="my-theme"></div><div class="preset"><label for="preset">Starting point</label><select id="preset"><option value="dark">Dark</option><option value="light">Light</option></select></div></div>
      <section class="vars-panel"><div class="section-head"><div><span class="eyebrow">OPTIONAL PALETTE</span><h2>Variables</h2></div><button id="addVarBtn" type="button">+ Add variable</button></div><p class="vars-help">Reuse colors across tokens and export values. References stay portable in Pi themes.</p><div id="varsList"></div></section>
      <div class="toolbar"><input id="search" placeholder="⌕  Filter tokens..." aria-label="Filter tokens"><span id="count"></span></div>
      <div id="tokenList" class="token-list"></div>
    </aside>
    <section class="panel preview-wrap">
      <div class="preview-head"><div><span class="eyebrow">LIVE PREVIEW</span><h2 id="previewTitle">Pi session</h2></div><span class="status"><i></i> local preview</span></div>
      <div class="preview-tools"><div id="previewTabs" class="preview-tabs" role="tablist" aria-label="Preview modes"></div><button id="demoBtn" type="button">Use built-in demo</button><button id="clearSessionBtn" type="button" class="danger-action">Clear imported session</button></div>
      <div id="sessionNotice" class="session-notice" role="status"></div>
      <div id="preview" class="terminal" tabindex="0"></div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
